<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Login - MangaHub</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-md-5">

				<div class="card shadow">
					<div class="card-header bg-primary text-white text-center">
						<h3>MangaHub</h3>
						<p class="mb-0">Iniciar Sesión</p>
					</div>

					<div class="card-body p-4">



						<form th:action="@{/login}" th:object="${login}" method="post">

							<div class="mb-3">
								<label class="form-label">Usuario</label>
								<input type="text" th:field="*{cuenta}" class="form-control" required>
							</div>

							<div class="mb-3">
								<label class="form-label">Contraseña</label>
								<input type="password" th:field="*{clave}" class="form-control" required>
							</div>

							<div class="d-grid">
								<button type="submit" class="btn btn-success">
									Ingresar
								</button>
							</div>

						</form>

					</div>
				</div>

			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

	<script th:inline="javascript">
		const error = /*[[${error}]]*/ null;

		if (error) {
			Swal.fire({
				icon: 'error',
				title: 'Inicio de sesión incorrecto',
				text: error,
				confirmButtonText: 'Aceptar',
				confirmButtonColor: '#0d6efd'
			});
		}
	</script>


</body>

</html>
