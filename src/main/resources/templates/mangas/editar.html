<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Editar Manga</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

	<nav class="navbar navbar-dark bg-primary">
		<div class="container">
			<span class="navbar-brand">MangaHub</span>
		</div>
	</nav>

	<div class="container mt-4">
		<div class="card shadow">

			<div class="card-header bg-warning text-dark">
				<h3>Editar Manga</h3>
			</div>

			<div class="card-body">

				<form th:action="@{/mangas/actualizar/{id}(id=${idManga})}" th:object="${manga}" method="post">

					<div class="row">

						<div class="col-md-6 mb-3">
							<label class="form-label">Título</label>
							<input type="text" th:field="*{titulo}" class="form-control" required>
						</div>

						<div class="col-md-6 mb-3">
							<label class="form-label">Número de Tomo</label>
							<input type="number" th:field="*{numTomo}" class="form-control" min="1" required>
						</div>

						<div class="col-md-6 mb-3">
							<label class="form-label">Autor</label>
							<input type="text" th:field="*{autor}" class="form-control" required>
						</div>

						<div class="col-md-3 mb-3">
							<label class="form-label">Precio</label>
							<input type="number" th:field="*{precio}" class="form-control" step="0.01" min="0" required>
						</div>

						<div class="col-md-3 mb-3">
							<label class="form-label">Stock</label>
							<input type="number" th:field="*{stock}" class="form-control" min="0" required>
						</div>

						<div class="col-md-4 mb-3">
							<label class="form-label">Editorial</label>
							<select th:field="*{idEditorial}" class="form-select" required>
								<option value="">Seleccione</option>
								<option th:each="editorial : ${listaEditoriales}" th:value="${editorial.idEditorial}"
									th:text="${editorial.nombre}">
								</option>
							</select>
						</div>

						<div class="col-md-4 mb-3">
							<label class="form-label">Género</label>
							<select th:field="*{idGenero}" class="form-select" required>
								<option value="">Seleccione</option>
								<option th:each="genero : ${listaGeneros}" th:value="${genero.idGenero}"
									th:text="${genero.descripcion}">
								</option>
							</select>
						</div>

						<div class="col-md-4 mb-3">
							<label class="form-label">Proveedor</label>
							<select th:field="*{idProveedor}" class="form-select" required>
								<option value="">Seleccione</option>
								<option th:each="proveedor : ${listaProveedores}" th:value="${proveedor.idProveedor}"
									th:text="${proveedor.razonSocial}">
								</option>
							</select>
						</div>

					</div>

					<button type="submit" class="btn btn-warning">
						Actualizar Manga
					</button>

					<a th:href="@{/mangas}" class="btn btn-secondary">
						Cancelar
					</a>

				</form>
			</div>
		</div>
	</div>

</body>

</html>
