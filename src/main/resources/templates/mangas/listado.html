<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Listado de Mangas</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

	<nav class="navbar navbar-dark bg-primary">
		<div class="container">
			<span class="navbar-brand">MangaHub</span>
			<a th:href="@{/}" class="btn btn-light">
				Volver al inicio
			</a>
		</div>
	</nav>

	<div class="container mt-4">

		<div class="card shadow">

			<div class="card-header bg-primary text-white">
				<h3>Listado de Mangas</h3>
			</div>

			<div class="card-body">



				<a th:if="${session.rol == 'ADMIN'}" th:href="@{/mangas/nuevo}" class="btn btn-success mb-3">
					Registrar nuevo manga
				</a>

				<form th:action="@{/mangas}" method="get">

					<div class="row mb-3">

						<div class="col-md-3">
							<label class="form-label">Editorial</label>
							<select name="idEditorial" class="form-select">
								<option value="">Todas</option>
								<option th:each="editorial : ${listaEditoriales}" th:value="${editorial.idEditorial}"
									th:text="${editorial.nombre}" th:selected="${editorial.idEditorial == idEditorial}">
								</option>
							</select>
						</div>

						<div class="col-md-3">
							<label class="form-label">Género</label>
							<select name="idGenero" class="form-select">
								<option value="">Todos</option>
								<option th:each="genero : ${listaGeneros}" th:value="${genero.idGenero}"
									th:text="${genero.descripcion}" th:selected="${genero.idGenero == idGenero}">
								</option>
							</select>
						</div>

						<div class="col-md-3">
							<label class="form-label">Proveedor</label>
							<select name="idProveedor" class="form-select">
								<option value="">Todos</option>
								<option th:each="proveedor : ${listaProveedores}" th:value="${proveedor.idProveedor}"
									th:text="${proveedor.razonSocial}"
									th:selected="${proveedor.idProveedor == idProveedor}">
								</option>
							</select>
						</div>

						<div class="col-md-3 d-flex align-items-end gap-2">
							<button type="submit" class="btn btn-primary">
								Buscar
							</button>
							<a th:href="@{/mangas}" class="btn btn-secondary">
								Limpiar
							</a>
						</div>

					</div>
				</form>

				<div class="table-responsive">
					<table class="table table-striped table-bordered table-hover align-middle">

						<thead class="table-dark">
							<tr>
								<th>ID</th>
								<th>Título</th>
								<th>Tomo</th>
								<th>Autor</th>
								<th>Precio</th>
								<th>Stock</th>
								<th>Editorial</th>
								<th>Género</th>
								<th>Proveedor</th>
								<th>Estado</th>
								<th th:if="${session.rol == 'ADMIN'}">Acciones</th>
							</tr>
						</thead>

						<tbody>
							<tr th:each="manga : ${listaMangas}">

								<td th:text="${manga.idManga}"></td>
								<td th:text="${manga.titulo}"></td>
								<td th:text="${manga.numTomo}"></td>
								<td th:text="${manga.autor}"></td>
								<td th:text="${manga.precio}"></td>
								<td th:text="${manga.stock}"></td>
								<td th:text="${manga.editorial.nombre}"></td>
								<td th:text="${manga.genero.descripcion}"></td>
								<td th:text="${manga.proveedor.razonSocial}"></td>

								<td>
									<span th:if="${manga.activo}" class="badge bg-success">
										Activo
									</span>
									<span th:unless="${manga.activo}" class="badge bg-danger">
										Inactivo
									</span>
								</td>


								<td th:if="${session.rol == 'ADMIN'}">
									<div class="d-flex gap-1">

										<a th:href="@{/mangas/editar/{id}(id=${manga.idManga})}"
											class="btn btn-warning btn-sm">
											Editar
										</a>

										<form th:if="${manga.activo}"
											th:action="@{/mangas/desactivar/{id}(id=${manga.idManga})}" method="post">

											<button type="submit" class="btn btn-danger btn-sm"
												onclick="return confirm('¿Deseas desactivar este manga?')">
												Desactivar
											</button>
										</form>

										<form th:unless="${manga.activo}"
											th:action="@{/mangas/activar/{id}(id=${manga.idManga})}" method="post">

											<button type="submit" class="btn btn-success btn-sm">
												Activar
											</button>
										</form>

									</div>
								</td>

							</tr>
						</tbody>

					</table>
				</div>

				<div class="d-flex justify-content-between align-items-center mt-4 flex-wrap gap-3">

					<span class="text-muted">
						Total de mangas:
						<strong th:text="${totalElementos}">0</strong>
					</span>

					<nav th:if="${totalPaginas > 1}">
						<ul class="pagination mb-0">

							<li class="page-item" th:classappend="${paginaActual == 0} ? 'disabled'">

								<a class="page-link"
									th:href="@{/mangas(pagina=${paginaActual - 1}, idEditorial=${idEditorial}, idGenero=${idGenero}, idProveedor=${idProveedor})}">
									Anterior
								</a>
							</li>

							<li class="page-item" th:each="i : ${#numbers.sequence(0, totalPaginas - 1)}"
								th:classappend="${i == paginaActual} ? 'active'">

								<a class="page-link"
									th:href="@{/mangas(pagina=${i}, idEditorial=${idEditorial}, idGenero=${idGenero}, idProveedor=${idProveedor})}"
									th:text="${i + 1}">
								</a>
							</li>

							<li class="page-item" th:classappend="${paginaActual == totalPaginas - 1} ? 'disabled'">

								<a class="page-link"
									th:href="@{/mangas(pagina=${paginaActual + 1}, idEditorial=${idEditorial}, idGenero=${idGenero}, idProveedor=${idProveedor})}">
									Siguiente
								</a>
							</li>

						</ul>
					</nav>

				</div>

			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

	<div th:if="${alert}" th:utext="${alert}"></div>

</body>

</html>
