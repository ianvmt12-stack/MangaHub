<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Registrar Venta - MangaHub</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

	<div class="container mt-5">

		<h2 class="mb-4">Registrar Venta</h2>

		<div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
		<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

		<div class="card mb-4">
			<div class="card-header bg-primary text-white">
				Agregar Manga
			</div>

			<div class="card-body">
				<form th:action="@{/ventas/agregar}" method="post">

					<div class="row">
						<div class="col-md-6 mb-3">
							<label class="form-label">Manga</label>
							<select name="idManga" class="form-select" required>
								<option value="">Seleccione un manga</option>
								<option th:each="manga : ${mangas}" th:value="${manga.idManga}"
									th:text="${manga.titulo}">
								</option>
							</select>
						</div>

						<div class="col-md-3 mb-3">
							<label class="form-label">Cantidad</label>
							<input type="number" name="cantidad" class="form-control" min="1" required>
						</div>

						<div class="col-md-3 mb-3 d-flex align-items-end">
							<button type="submit" class="btn btn-primary w-100">
								Agregar
							</button>
						</div>
					</div>

				</form>
			</div>
		</div>

		<div class="card mb-4">
			<div class="card-header bg-secondary text-white">
				Mangas Seleccionados
			</div>

			<div class="card-body">
				<table class="table table-bordered table-striped">
					<thead class="table-dark">
						<tr>
							<th>Manga</th>
							<th>Cantidad</th>
							<th>Precio</th>
							<th>Subtotal</th>
						</tr>
					</thead>

					<tbody>
						<tr th:each="item : ${mangasSeleccionados}">
							<td th:text="${item.titulo}"></td>
							<td th:text="${item.cantidad}"></td>
							<td th:text="${item.precio}"></td>
							<td th:text="${item.subtotal}"></td>
						</tr>

						<tr th:if="${#lists.isEmpty(mangasSeleccionados)}">
							<td colspan="4" class="text-center">
								No se han agregado mangas
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>

		<div class="card">
			<div class="card-header bg-success text-white">
				Datos de la Venta
			</div>

			<div class="card-body">
				<form th:action="@{/ventas/registrar}" method="post">

					<div class="mb-3">
						<label class="form-label">Otaku</label>
						<select name="idCliente" class="form-select" required>
							<option value="">Seleccione un otaku</option>
							<option th:each="cliente : ${clientes}" th:value="${cliente.idCliente}"
								th:text="${cliente.nombres + ' ' + cliente.apellidos}">
							</option>
						</select>
					</div>

					<button type="submit" class="btn btn-success" th:disabled="${#lists.isEmpty(mangasSeleccionados)}">
						Registrar Venta
					</button>

					<a th:href="@{/}" class="btn btn-secondary">
						Volver
					</a>

				</form>
			</div>
		</div>

	</div>

</body>

</html>
