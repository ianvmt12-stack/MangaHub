<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Listado de Ventas - MangaHub</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

	<div class="container mt-5">

		<h2 class="mb-4">Historial de Compras Otaku</h2>

		<div class="card mb-4">
			<div class="card-header bg-primary text-white">
				Consultar Compras Otaku
			</div>

			<div class="card-body">

				<form th:action="@{/ventas/listado}" th:object="${filtro}" method="get">

					<div class="row">

						<div class="col-md-3 mb-3">
							<label class="form-label">N° Venta</label>
							<input type="number" th:field="*{idVenta}" class="form-control" min="1">
						</div>

						<div class="col-md-3 mb-3">
							<label class="form-label">Cliente</label>
							<select th:field="*{idCliente}" class="form-select">
								<option value="">Todos</option>
								<option th:each="cliente : ${clientes}" th:value="${cliente.idCliente}"
									th:text="${cliente.nombres + ' ' + cliente.apellidos}">
								</option>
							</select>
						</div>

						<div class="col-md-3 mb-3">
							<label class="form-label">Fecha Inicio</label>
							<input type="date" th:field="*{fechaInicio}" class="form-control">
						</div>

						<div class="col-md-3 mb-3">
							<label class="form-label">Fecha Fin</label>
							<input type="date" th:field="*{fechaFin}" class="form-control">
						</div>

					</div>

					<button type="submit" class="btn btn-primary">
						Buscar
					</button>

					<a th:href="@{/ventas/listado}" class="btn btn-secondary">
						Limpiar
					</a>

					<a th:href="@{/ventas/nuevo}" class="btn btn-success">
						Nueva Compra Otaku
					</a>

					<a th:href="@{/}" class="btn btn-outline-secondary">
						Volver
					</a>

				</form>

			</div>
		</div>

		<div class="card">
			<div class="card-header bg-secondary text-white">
				Compras Registradas
			</div>

			<div class="card-body">

				<div class="table-responsive">
					<table class="table table-bordered table-striped">
						<thead class="table-dark">
							<tr>
								<th>N° Compra</th>
								<th>Fecha</th>
								<th>Otaku</th>
								<th>Usuario</th>
								<th>Total</th>
								<th>Estado</th>
							</tr>
						</thead>

						<tbody>
							<tr th:each="venta : ${ventas}">
								<td th:text="${venta.idVenta}"></td>
								<td th:text="${#temporals.format(venta.fechaEmision, 'dd/MM/yyyy HH:mm')}"></td>
								<td th:text="${venta.cliente.nombres + ' ' + venta.cliente.apellidos}"></td>
								<td th:text="${venta.usuario.nombres}"></td>
								<td th:text="${venta.montoTotal}"></td>
								<td>
									<span th:if="${venta.activo}" class="badge bg-success">
										Activa
									</span>
									<span th:unless="${venta.activo}" class="badge bg-danger">
										Inactiva
									</span>
								</td>
							</tr>

							<tr th:if="${#lists.isEmpty(ventas)}">
								<td colspan="6" class="text-center">
									No se encontraron compras
								</td>
							</tr>
						</tbody>
					</table>
				</div>

			</div>
		</div>

	</div>

</body>

</html>
