<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Listado de Otakus</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

	<nav class="navbar navbar-dark bg-primary">
		<div class="container">
			<span class="navbar-brand">MangaHub</span>
			<a th:href="@{/}" class="btn btn-light">
				Volver al inicio
			</a>
		</div>
	</nav>

	<div class="container mt-4">
		<div class="card shadow">

			<div class="card-header bg-info text-white">
				<h3>Listado de Otakus</h3>
			</div>

			<div class="card-body">

				<a th:href="@{/clientes/nuevo}" class="btn btn-success mb-3">
					Registrar nuevo otaku
				</a>

				<div class="table-responsive">
					<table class="table table-striped table-bordered table-hover align-middle">

						<thead class="table-dark">
							<tr>
								<th>ID</th>
								<th>DNI</th>
								<th>Nombres</th>
								<th>Apellidos</th>
								<th>Teléfono</th>
								<th>Correo</th>
								<th>Estado</th>
								<th>Acciones</th>
							</tr>
						</thead>

						<tbody>
							<tr th:each="cliente : ${listaClientes}">

								<td th:text="${cliente.idCliente}"></td>
								<td th:text="${cliente.dni}"></td>
								<td th:text="${cliente.nombres}"></td>
								<td th:text="${cliente.apellidos}"></td>
								<td th:text="${cliente.telefono}"></td>
								<td th:text="${cliente.correo}"></td>

								<td>
									<span th:if="${cliente.activo}" class="badge bg-success">
										Activo
									</span>

									<span th:unless="${cliente.activo}" class="badge bg-danger">
										Inactivo
									</span>
								</td>

								<td>
									<div class="d-flex gap-1">

										<a th:href="@{/clientes/editar/{id}(id=${cliente.idCliente})}"
											class="btn btn-warning btn-sm">
											Editar
										</a>

										<form th:if="${cliente.activo}"
											th:action="@{/clientes/desactivar/{id}(id=${cliente.idCliente})}"
											method="post">

											<button type="submit" class="btn btn-danger btn-sm"
												onclick="return confirm('¿Deseas desactivar este otaku?')">
												Desactivar
											</button>
										</form>

										<form th:unless="${cliente.activo}"
											th:action="@{/clientes/activar/{id}(id=${cliente.idCliente})}"
											method="post">

											<button type="submit" class="btn btn-success btn-sm">
												Activar
											</button>
										</form>

									</div>
								</td>

							</tr>
						</tbody>

					</table>
				</div>

			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

	<div th:if="${alert}" th:utext="${alert}"></div>

</body>

</html>
