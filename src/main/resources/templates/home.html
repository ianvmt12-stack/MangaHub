<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>MangaHub - Inicio</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

	<nav class="navbar navbar-dark bg-primary">
		<div class="container">
			<span class="navbar-brand">MangaHub</span>
			<a th:href="@{/logout}" class="btn btn-danger">
				Cerrar sesión
			</a>
		</div>
	</nav>

	<div class="container mt-5">

		<div class="card shadow">
			<div class="card-header bg-primary text-white">
				<h3>Bienvenido a MangaHub</h3>
			</div>

			<div class="card-body">

				<h5>Sistema de Gestión de Mangas</h5>

				<p th:if="${session.usuario != null}">
					Usuario:
					<strong th:text="${session.usuario}"></strong>
				</p>

				<p th:if="${session.rol != null}">
					Rol:
					<span class="badge bg-success" th:text="${session.rol}"></span>
				</p>

				<hr>

				<h5>Menú Principal</h5>

				<div class="d-grid gap-3 col-md-6">

					<a th:href="@{/mangas}" class="btn btn-primary">
						Ver catálogo de mangas
					</a>

					<a th:href="@{/mangas/nuevo}" class="btn btn-success">
						Registrar nuevo manga
					</a>

					<a th:href="@{/clientes}" class="btn btn-info text-white">
						Gestionar clientes
					</a>

				</div>
			</div>
		</div>
	</div>

</body>

</html>
