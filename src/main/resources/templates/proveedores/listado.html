<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MangaHub - Proveedores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">MangaHub</span>
            <a th:href="@{/}" class="btn btn-light">Volver al inicio</a>
        </div>
    </nav>
    <main class="container mt-4 mb-5">
        <div class="card shadow">
            <div class="card-header bg-info text-dark"><h1 class="h3 mb-0">Gestión de proveedores</h1></div>
            <div class="card-body">
                <div th:if="${mensaje}" class="alert alert-success" role="status" th:text="${mensaje}"></div>
                <a th:href="@{/proveedores/nuevo}" class="btn btn-success mb-3">Registrar nuevo proveedor</a>
                <form th:action="@{/proveedores}" method="get" class="row g-2 align-items-end mb-4">
                    <div class="col-md-7">
                        <label for="q" class="form-label">Buscar por RUC o razón social</label>
                        <input type="search" id="q" name="q" th:value="${busqueda}" class="form-control"
                               placeholder="Ingrese RUC o razón social" maxlength="255">
                    </div>
                    <div class="col-md-auto d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Buscar</button>
                        <a th:href="@{/proveedores}" class="btn btn-outline-secondary">Limpiar</a>
                    </div>
                </form>
                <div class="table-responsive">
                    <table class="table table-striped table-bordered table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th scope="col">ID</th><th scope="col">RUC</th><th scope="col">Razón social</th>
                                <th scope="col">Teléfono</th><th scope="col">Correo</th>
                                <th scope="col">Estado</th><th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(listaProveedores)}">
                                <td colspan="7" class="text-center text-muted py-4">No se encontraron proveedores.</td>
                            </tr>
                            <tr th:each="proveedor : ${listaProveedores}">
                                <td th:text="${proveedor.idProveedor}"></td>
                                <td th:text="${proveedor.ruc}"></td>
                                <td th:text="${proveedor.razonSocial}"></td>
                                <td th:text="${proveedor.telefono}"></td>
                                <td th:text="${proveedor.correo}"></td>
                                <td>
                                    <span th:if="${proveedor.activo == true}" class="badge bg-success">Activo</span>
                                    <span th:unless="${proveedor.activo == true}" class="badge bg-danger">Inactivo</span>
                                </td>
                                <td>
                                    <div class="d-flex gap-2">
                                        <a th:href="@{/proveedores/editar/{id}(id=${proveedor.idProveedor})}"
                                           class="btn btn-warning btn-sm">Editar</a>
                                        <form th:if="${proveedor.activo == true}"
                                              th:action="@{/proveedores/desactivar/{id}(id=${proveedor.idProveedor})}" method="post">
                                            <button type="submit" class="btn btn-danger btn-sm"
                                                    onclick="return confirm('¿Deseas desactivar este proveedor?')">Desactivar</button>
                                        </form>
                                        <form th:unless="${proveedor.activo == true}"
                                              th:action="@{/proveedores/activar/{id}(id=${proveedor.idProveedor})}" method="post">
                                            <button type="submit" class="btn btn-success btn-sm">Activar</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
