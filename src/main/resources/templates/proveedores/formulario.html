<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${idProveedor == null ? 'Registrar proveedor' : 'Editar proveedor'}">Proveedor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container"><span class="navbar-brand">MangaHub</span></div>
    </nav>
    <main class="container mt-4 mb-5">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h1 class="h3 mb-0" th:text="${idProveedor == null ? 'Registrar nuevo proveedor' : 'Editar proveedor'}"></h1>
            </div>
            <div class="card-body">
                <div th:if="${mensajeError}" class="alert alert-danger" role="alert" th:text="${mensajeError}"></div>
                <form th:action="${idProveedor == null} ? @{/proveedores/guardar} : @{/proveedores/actualizar/{id}(id=${idProveedor})}"
                      th:object="${proveedor}" method="post">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="ruc" class="form-label">RUC</label>
                            <input type="text" id="ruc" th:field="*{ruc}" class="form-control" inputmode="numeric"
                                   minlength="11" maxlength="11" pattern="[0-9]{11}" required aria-describedby="ayudaRuc">
                            <div id="ayudaRuc" class="form-text">Ingrese los 11 dígitos del RUC.</div>
                        </div>
                        <div class="col-md-8 mb-3">
                            <label for="razonSocial" class="form-label">Razón social</label>
                            <input type="text" id="razonSocial" th:field="*{razonSocial}" class="form-control"
                                   maxlength="255" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="telefono" class="form-label">Teléfono (opcional)</label>
                            <input type="tel" id="telefono" th:field="*{telefono}" class="form-control" maxlength="255">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="correo" class="form-label">Correo (opcional)</label>
                            <input type="email" id="correo" th:field="*{correo}" class="form-control" maxlength="255">
                        </div>
                    </div>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-success"
                                th:text="${idProveedor == null ? 'Guardar proveedor' : 'Actualizar proveedor'}"></button>
                        <button type="reset" class="btn btn-outline-secondary">Restablecer</button>
                        <a th:href="@{/proveedores}" class="btn btn-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
