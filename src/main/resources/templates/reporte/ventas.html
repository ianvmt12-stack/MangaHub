<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Reporte de Compras Otaku - MangaHub</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		@media print {
			.no-imprimir {
				display: none;
			}
		}
	</style>
</head>

<body class="bg-light">

	<div class="container mt-5">

		<h2 class="mb-4">Reporte de Compras - MangaHub</h2>

		<div class="mb-3 no-imprimir">
			<button type="button" class="btn btn-primary" onclick="window.print()">
				Imprimir Reporte Otaku
			</button>

			<a th:href="@{/ventas/listado}" class="btn btn-secondary">
				Volver
			</a>
		</div>

		<div class="row mb-4">
			<div class="col-md-6">
				<div class="card bg-success text-white">
					<div class="card-body">
						<h5>Total de Compras</h5>
						<h3 th:text="${'S/ ' + totalGeneral}">S/ 0.00</h3>
					</div>
				</div>
			</div>

			<div class="col-md-6">
				<div class="card bg-primary text-white">
					<div class="card-body">
						<h5>Mangas adquiridos</h5>
						<h3 th:text="${cantidadVendida}">0</h3>
					</div>
				</div>
			</div>
		</div>

		<div class="card">
			<div class="card-header bg-dark text-white">
				Detalle de Compras Otaku
			</div>

			<div class="card-body">
				<div class="table-responsive">
					<table class="table table-bordered table-striped">
						<thead class="table-dark">
							<tr>
								<th>N° Compra</th>
								<th>Fecha</th>
								<th>Otaku</th>
								<th>Manga</th>
								<th>Cantidad</th>
								<th>Precio</th>
								<th>Subtotal</th>
							</tr>
						</thead>

						<tbody>
							<tr th:each="detalle : ${detalles}">
								<td th:text="${detalle.venta.idVenta}"></td>
								<td th:text="${#temporals.format(detalle.venta.fechaEmision, 'dd/MM/yyyy HH:mm')}"></td>
								<td th:text="${detalle.venta.cliente.nombres + ' ' + detalle.venta.cliente.apellidos}">
								</td>
								<td th:text="${detalle.manga.titulo}"></td>
								<td th:text="${detalle.cantidad}"></td>
								<td th:text="${detalle.precio}"></td>
								<td th:text="${detalle.precio * detalle.cantidad}"></td>
							</tr>

							<tr th:if="${#lists.isEmpty(detalles)}">
								<td colspan="7" class="text-center">
									No existen compras registradas
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>

	</div>

</body>

</html>
